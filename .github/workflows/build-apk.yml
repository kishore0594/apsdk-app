name: Build APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo only ships lib/ and pubspec.yaml (see README). If the
      # android/ folder isn't in the repo yet, generate it automatically
      # so the build can proceed without any local setup.
      - name: Generate Android project files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name apsdk --org com.yourstore .
          fi

      - name: Set app name to APSDK
        run: |
          sed -i 's/android:label="[^"]*"/android:label="APSDK"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: apsdk-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
