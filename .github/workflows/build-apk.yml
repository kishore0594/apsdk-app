name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Configure compileSdk 36 safely
        run: |
          echo "android.compileSdk=36" >> android/gradle.properties

          if [ -f "android/build.gradle.kts" ]; then
            echo "" >> android/build.gradle.kts
            echo "subprojects {" >> android/build.gradle.kts
            echo "    val configAction: () -> Unit = {" >> android/build.gradle.kts
            echo "        val androidObj = extensions.findByName(\"android\")" >> android/build.gradle.kts
            echo "        if (androidObj is com.android.build.gradle.BaseExtension) {" >> android/build.gradle.kts
            echo "            androidObj.compileSdkVersion(36)" >> android/build.gradle.kts
            echo "        }" >> android/build.gradle.kts
            echo "    }" >> android/build.gradle.kts
            echo "    if (state.executed) { configAction() } else { afterEvaluate { configAction() } }" >> android/build.gradle.kts
            echo "}" >> android/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' android/app/build.gradle.kts
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhura-agro-traders-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
