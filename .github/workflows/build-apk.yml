name: Build APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo only ships lib/ and pubspec.yaml (see README). If the
      # android/ folder isn't in the repo yet — or exists but is missing
      # its actual app files (e.g. from a stray/partial folder) — wipe it
      # and regenerate cleanly, so the build can proceed without any
      # local setup.
      # Checks for the manifest AND the app-level Gradle file (not just
      # one of them) before deciding the Android project is complete —
      # a partial/stray commit that includes only some Android files
      # (e.g. from manually editing android/ outside this workflow)
      # would otherwise fool a single-file check into skipping
      # regeneration, leaving a broken half-project behind.
      - name: Generate Android project files if missing
        run: |
          COMPLETE=true
          [ -f "android/app/src/main/AndroidManifest.xml" ] || COMPLETE=false
          [ -f "android/app/build.gradle.kts" ] || [ -f "android/app/build.gradle" ] || COMPLETE=false

          if [ "$COMPLETE" = false ]; then
            echo "Android project missing or incomplete — regenerating from scratch"
            rm -rf android
            flutter create --platforms=android --project-name madhura_agro_traders --org com.yourstore .
          fi

          COMPLETE=true
          [ -f "android/app/src/main/AndroidManifest.xml" ] || COMPLETE=false
          [ -f "android/app/build.gradle.kts" ] || [ -f "android/app/build.gradle" ] || COMPLETE=false
          if [ "$COMPLETE" = false ]; then
            echo "::error::Android project still incomplete after flutter create — something about the Flutter/Android toolchain may have changed."
            exit 1
          fi

      - name: Set app name to Madhura Agro Traders
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Madhura Agro Traders"/' android/app/src/main/AndroidManifest.xml

      # Every build must be signed with the SAME key, or Android refuses
      # to install it as an update over the existing app ("App not
      # installed") and forces an uninstall every single time. Since
      # android/ is regenerated fresh on every run (a brand new,
      # ephemeral VM each time — see the step above), there is no
      # keystore that naturally persists between builds on its own;
      # without this step, Flutter falls back to a debug key that's
      # randomly different on every run. This decodes one fixed,
      # permanent keystore (stored as a repo secret, generated once) and
      # uses it for every build from now on, so updates finally install
      # cleanly over the existing app.
      # Promotions sends the product photo straight into a vendor's
      # WhatsApp chat (whatsapp_share2). That needs (1) a FileProvider so
      # WhatsApp is allowed to read the photo file, and (2) <queries>
      # entries so Android 11+ lets the app detect WhatsApp / WhatsApp
      # Business at all. Both are added to the freshly generated manifest.
      - name: Configure WhatsApp photo sharing (FileProvider + queries)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/provider_paths.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <external-files-path name="external_app_files" path="." />
              <cache-path name="cache_files" path="." />
          </paths>
          XMLEOF
          sed -i 's/^          //' android/app/src/main/res/xml/provider_paths.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $MANIFEST
          sed -i 's#</application>#    <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.provider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/provider_paths" /></provider>\n    </application>#' $MANIFEST
          if grep -q "<queries>" $MANIFEST; then
            sed -i 's#<queries>#<queries>\n        <package android:name="com.whatsapp" />\n        <package android:name="com.whatsapp.w4b" />#' $MANIFEST
          else
            sed -i 's#</manifest>#    <queries>\n        <package android:name="com.whatsapp" />\n        <package android:name="com.whatsapp.w4b" />\n    </queries>\n</manifest>#' $MANIFEST
          fi
          cat $MANIFEST

          # Native "send photo to one WhatsApp contact" handler. Written
          # in-house (not a third-party plugin) so it can't break the
          # build the way the unmaintained whatsapp_share2 package did.
          # Keeps the package line Flutter generated, replaces the body.
          MAIN=$(find android/app/src/main -name "MainActivity.kt" | head -1)
          if [ -z "$MAIN" ]; then
            echo "::error::MainActivity.kt not found — Android project layout changed."
            exit 1
          fi
          PKG_LINE=$(grep -m1 '^package ' "$MAIN")
          echo "$PKG_LINE" > "$MAIN"
          cat >> "$MAIN" << 'KTEOF'

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  setupNotifications(flutterEngine)
                  setupVideo(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "madhura/whatsapp")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "sendImage") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          try {
                              val phone = call.argument<String>("phone") ?: ""
                              val text = call.argument<String>("text") ?: ""
                              val path = call.argument<String>("path") ?: ""
                              // Several pictures (offer pages) or a video: optional extras.
                              val paths = call.argument<List<String>>("paths") ?: listOf(path)
                              val mime = call.argument<String>("mime") ?: "image/*"
                              val waPackage = listOf("com.whatsapp", "com.whatsapp.w4b").firstOrNull { isInstalled(it) }
                              if (waPackage == null) {
                                  result.success("not_installed")
                                  return@setMethodCallHandler
                              }
                              val uris = ArrayList<Uri>(paths.map { FileProvider.getUriForFile(this, "$packageName.provider", File(it)) })
                              val intent = (if (uris.size > 1) Intent(Intent.ACTION_SEND_MULTIPLE) else Intent(Intent.ACTION_SEND)).apply {
                                  setPackage(waPackage)
                                  type = mime
                                  if (uris.size > 1) putParcelableArrayListExtra(Intent.EXTRA_STREAM, uris)
                                  else putExtra(Intent.EXTRA_STREAM, uris[0])
                                  putExtra(Intent.EXTRA_TEXT, text)
                                  // WhatsApp's own field for "open this contact's chat".
                                  putExtra("jid", "$phone@s.whatsapp.net")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              }
                              startActivity(intent)
                              result.success("ok")
                          } catch (e: Exception) {
                              result.error("share_failed", e.message, null)
                          }
                      }
              }

              // New-order alerts: sound, vibration and the notification bar.
              // Written in-house (no plugin) so it can't break the build.
              private fun setupNotifications(flutterEngine: FlutterEngine) {
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "madhura/notify")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "permission" -> {
                                  // Create the loud "New orders" channel up front, so alerts sent by
                                  // the server (app closed) use it too.
                                  if (Build.VERSION.SDK_INT >= 26) {
                                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                                      if (nm.getNotificationChannel("orders") == null) {
                                          val ch = NotificationChannel("orders", "New orders", NotificationManager.IMPORTANCE_HIGH)
                                          ch.description = "New web store orders"
                                          ch.enableVibration(true)
                                          ch.vibrationPattern = longArrayOf(0, 400, 200, 400)
                                          nm.createNotificationChannel(ch)
                                      }
                                  }
                                  if (Build.VERSION.SDK_INT >= 33 &&
                                      checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED
                                  ) {
                                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 7001)
                                      result.success(false)
                                  } else {
                                      result.success(true)
                                  }
                              }
                              "show" -> {
                                  try {
                                      if (Build.VERSION.SDK_INT >= 33 &&
                                          checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED
                                      ) {
                                          result.success(false)
                                          return@setMethodCallHandler
                                      }
                                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                                      if (Build.VERSION.SDK_INT >= 26 && manager.getNotificationChannel("orders") == null) {
                                          val channel = NotificationChannel("orders", "New orders", NotificationManager.IMPORTANCE_HIGH)
                                          channel.description = "New web store orders"
                                          channel.enableVibration(true)
                                          channel.vibrationPattern = longArrayOf(0, 400, 200, 400)
                                          manager.createNotificationChannel(channel)
                                      }
                                      val open = Intent(this, MainActivity::class.java).apply {
                                          flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                                      }
                                      val pending = PendingIntent.getActivity(
                                          this, 0, open,
                                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                                      )
                                      val notification = NotificationCompat.Builder(this, "orders")
                                          .setSmallIcon(android.R.drawable.stat_notify_chat)
                                          .setContentTitle(call.argument<String>("title") ?: "New order")
                                          .setContentText(call.argument<String>("body") ?: "")
                                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                                          .setDefaults(NotificationCompat.DEFAULT_ALL)
                                          .setAutoCancel(true)
                                          .setContentIntent(pending)
                                          .build()
                                      manager.notify(call.argument<Int>("id") ?: 1, notification)
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.error("notify_failed", e.message, null)
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              // Status videos: the app draws each frame, this turns them into one
              // MP4 (H.264, 1080x1920, falls back to 720x1280 on older phones).
              // Written in-house with Android's own MediaCodec, so no big plugin.
              private val videoExecutor = java.util.concurrent.Executors.newSingleThreadExecutor()
              private var reelEncoder: ReelEncoder? = null

              private fun setupVideo(flutterEngine: FlutterEngine) {
                  val main = android.os.Handler(android.os.Looper.getMainLooper())
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "madhura/video")
                      .setMethodCallHandler { call, result ->
                          val ok: (Any?) -> Unit = { v -> main.post { result.success(v) } }
                          val fail: (Throwable) -> Unit = { e -> main.post { result.error("video_failed", e.message ?: e.toString(), null) } }
                          when (call.method) {
                              "start" -> {
                                  val path = call.argument<String>("path") ?: ""
                                  val fps = call.argument<Int>("fps") ?: 30
                                  val bitrate = call.argument<Int>("bitrate") ?: 8000000
                                  videoExecutor.execute {
                                      try {
                                          reelEncoder?.cancel()
                                          reelEncoder = null
                                          var enc: ReelEncoder? = null
                                          var last: Throwable? = null
                                          for (size in listOf(intArrayOf(1080, 1920), intArrayOf(720, 1280), intArrayOf(540, 960))) {
                                              try {
                                                  enc = ReelEncoder(path, size[0], size[1], fps, if (size[0] >= 1080) bitrate else bitrate / 2)
                                                  break
                                              } catch (e: Throwable) {
                                                  last = e
                                              }
                                          }
                                          val made = enc ?: throw (last ?: IllegalStateException("No video encoder on this phone"))
                                          reelEncoder = made
                                          ok(mapOf("width" to made.width, "height" to made.height))
                                      } catch (e: Throwable) {
                                          fail(e)
                                      }
                                  }
                              }
                              "frame" -> {
                                  val bytes = call.argument<ByteArray>("rgba")
                                  videoExecutor.execute {
                                      try {
                                          val enc = reelEncoder ?: throw IllegalStateException("Video not started")
                                          enc.addFrame(bytes ?: throw IllegalArgumentException("No picture"))
                                          ok(null)
                                      } catch (e: Throwable) {
                                          fail(e)
                                      }
                                  }
                              }
                              "finish" -> videoExecutor.execute {
                                  try {
                                      val enc = reelEncoder ?: throw IllegalStateException("Video not started")
                                      enc.finish()
                                      reelEncoder = null
                                      ok(true)
                                  } catch (e: Throwable) {
                                      reelEncoder?.cancel()
                                      reelEncoder = null
                                      fail(e)
                                  }
                              }
                              "cancel" -> videoExecutor.execute {
                                  reelEncoder?.cancel()
                                  reelEncoder = null
                                  ok(true)
                              }
                              "save" -> {
                                  val path = call.argument<String>("path") ?: ""
                                  val name = call.argument<String>("name") ?: "madhura.mp4"
                                  videoExecutor.execute {
                                      try {
                                          ok(saveVideo(path, name))
                                      } catch (e: Throwable) {
                                          fail(e)
                                      }
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              // Copies the video into the phone's Movies/Madhura folder (Gallery).
              private fun saveVideo(path: String, name: String): Boolean {
                  val src = File(path)
                  if (!src.exists()) return false
                  if (Build.VERSION.SDK_INT >= 29) {
                      val values = android.content.ContentValues().apply {
                          put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name)
                          put(android.provider.MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                          put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, "Movies/Madhura")
                          put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val uri = contentResolver.insert(android.provider.MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values) ?: return false
                      contentResolver.openOutputStream(uri)?.use { out -> src.inputStream().use { it.copyTo(out) } }
                      values.clear()
                      values.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 0)
                      contentResolver.update(uri, values, null, null)
                      return true
                  }
                  @Suppress("DEPRECATION")
                  val dir = File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_MOVIES), "Madhura")
                  dir.mkdirs()
                  val out = File(dir, name)
                  src.copyTo(out, overwrite = true)
                  android.media.MediaScannerConnection.scanFile(this, arrayOf(out.absolutePath), arrayOf("video/mp4"), null)
                  return true
              }

              private fun isInstalled(pkg: String): Boolean = try {
                  packageManager.getPackageInfo(pkg, 0)
                  true
              } catch (e: PackageManager.NameNotFoundException) {
                  false
              }
          }
          // Turns RGBA frames into an H.264 MP4 with MediaCodec + MediaMuxer.
          class ReelEncoder(path: String, val width: Int, val height: Int, private val fps: Int, bitrate: Int) {
              private val codec: android.media.MediaCodec
              private val muxer: android.media.MediaMuxer
              private val info = android.media.MediaCodec.BufferInfo()
              private var track = -1
              private var muxing = false
              private var released = false
              private var frames = 0L

              init {
                  val mime = android.media.MediaFormat.MIMETYPE_VIDEO_AVC
                  val format = android.media.MediaFormat.createVideoFormat(mime, width, height)
                  format.setInteger(
                      android.media.MediaFormat.KEY_COLOR_FORMAT,
                      android.media.MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible
                  )
                  format.setInteger(android.media.MediaFormat.KEY_BIT_RATE, bitrate)
                  format.setInteger(android.media.MediaFormat.KEY_FRAME_RATE, fps)
                  format.setInteger(android.media.MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                  val c = android.media.MediaCodec.createEncoderByType(mime)
                  try {
                      val caps = c.codecInfo.getCapabilitiesForType(mime).videoCapabilities
                      if (caps != null && !caps.isSizeSupported(width, height)) {
                          throw IllegalArgumentException("Size " + width + "x" + height + " not supported")
                      }
                      c.configure(format, null, null, android.media.MediaCodec.CONFIGURE_FLAG_ENCODE)
                      c.start()
                  } catch (e: Throwable) {
                      c.release()
                      throw e
                  }
                  codec = c
                  muxer = android.media.MediaMuxer(path, android.media.MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
              }

              fun addFrame(rgba: ByteArray) {
                  if (rgba.size < width * height * 4) throw IllegalArgumentException("Picture is the wrong size")
                  var index = -1
                  var tries = 0
                  while (index < 0) {
                      index = codec.dequeueInputBuffer(10000)
                      if (index < 0) {
                          drain(false)
                          tries++
                          if (tries > 500) throw IllegalStateException("Video encoder is not responding")
                      }
                  }
                  val image = codec.getInputImage(index) ?: throw IllegalStateException("Video encoder gave no picture buffer")
                  fillYuv(image, rgba)
                  codec.queueInputBuffer(index, 0, width * height * 3 / 2, frames * 1000000L / fps, 0)
                  frames++
                  drain(false)
              }

              private fun fillYuv(image: android.media.Image, rgba: ByteArray) {
                  val planes = image.planes
                  val yBuf = planes[0].buffer
                  val yRow = planes[0].rowStride
                  val yPix = planes[0].pixelStride
                  val uBuf = planes[1].buffer
                  val uRow = planes[1].rowStride
                  val uPix = planes[1].pixelStride
                  val vBuf = planes[2].buffer
                  val vRow = planes[2].rowStride
                  val vPix = planes[2].pixelStride
                  val w = width
                  val h = height
                  val row = ByteArray(w)
                  for (y in 0 until h) {
                      var i = y * w * 4
                      for (x in 0 until w) {
                          val r = rgba[i].toInt() and 0xff
                          val g = rgba[i + 1].toInt() and 0xff
                          val b = rgba[i + 2].toInt() and 0xff
                          row[x] = (((66 * r + 129 * g + 25 * b + 128) shr 8) + 16).toByte()
                          i += 4
                      }
                      if (yPix == 1) {
                          yBuf.position(y * yRow)
                          yBuf.put(row, 0, w)
                      } else {
                          for (x in 0 until w) yBuf.put(y * yRow + x * yPix, row[x])
                      }
                  }
                  for (y in 0 until h / 2) {
                      for (x in 0 until w / 2) {
                          val i = ((y * 2) * w + x * 2) * 4
                          val r = rgba[i].toInt() and 0xff
                          val g = rgba[i + 1].toInt() and 0xff
                          val b = rgba[i + 2].toInt() and 0xff
                          uBuf.put(y * uRow + x * uPix, (((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128).toByte())
                          vBuf.put(y * vRow + x * vPix, (((112 * r - 94 * g - 18 * b + 128) shr 8) + 128).toByte())
                      }
                  }
              }

              private fun drain(end: Boolean) {
                  var idle = 0
                  while (true) {
                      val index = codec.dequeueOutputBuffer(info, 10000)
                      if (index == android.media.MediaCodec.INFO_TRY_AGAIN_LATER) {
                          if (!end) return
                          idle++
                          if (idle > 300) return
                      } else if (index == android.media.MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          if (!muxing) {
                              track = muxer.addTrack(codec.outputFormat)
                              muxer.start()
                              muxing = true
                          }
                      } else if (index >= 0) {
                          val buf = codec.getOutputBuffer(index)
                          if ((info.flags and android.media.MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) info.size = 0
                          if (info.size > 0 && muxing && buf != null) {
                              buf.position(info.offset)
                              buf.limit(info.offset + info.size)
                              muxer.writeSampleData(track, buf, info)
                          }
                          codec.releaseOutputBuffer(index, false)
                          if ((info.flags and android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) return
                      }
                  }
              }

              fun finish() {
                  var index = -1
                  var tries = 0
                  while (index < 0 && tries < 500) {
                      index = codec.dequeueInputBuffer(10000)
                      if (index < 0) {
                          drain(false)
                          tries++
                      }
                  }
                  if (index >= 0) {
                      codec.queueInputBuffer(index, 0, 0, frames * 1000000L / fps, android.media.MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                  }
                  drain(true)
                  if (!muxing) {
                      release()
                      throw IllegalStateException("The video came out empty")
                  }
                  release()
              }

              fun cancel() {
                  try {
                      release()
                  } catch (e: Throwable) {
                      // already stopped
                  }
              }

              private fun release() {
                  if (released) return
                  released = true
                  try {
                      codec.stop()
                  } catch (e: Throwable) {
                      // not started
                  }
                  codec.release()
                  if (muxing) {
                      try {
                          muxer.stop()
                      } catch (e: Throwable) {
                          // nothing written
                      }
                  }
                  muxer.release()
              }
          }
          KTEOF
          cat "$MAIN"

          # FileProvider class used above lives in androidx.core.
          if [ -f "android/app/build.gradle.kts" ]; then
            printf '\ndependencies {\n    implementation("androidx.core:core:1.13.1")\n}\n' >> android/app/build.gradle.kts
          else
            printf "\ndependencies {\n    implementation 'androidx.core:core:1.13.1'\n}\n" >> android/app/build.gradle
          fi

      - name: Restore the permanent release signing key
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > android/app/madhura-release-key.jks
          # Confirms the decode actually produced a real keystore, rather
          # than letting a bad secret value silently produce a corrupt
          # file that only fails later, further from the real cause.
          if ! keytool -list -keystore android/app/madhura-release-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_BASE64 decoded, but the result isn't a valid keystore (or KEYSTORE_PASSWORD is wrong). Re-check both secrets were pasted completely and correctly."
            exit 1
          fi
          echo "Signing key restored and verified successfully."

      - name: Configure release signing
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            cat >> android/app/build.gradle.kts << 'SIGNEOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("madhura-release-key.jks")
                      storePassword = "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias = "madhura"
                      keyPassword = "${{ secrets.KEYSTORE_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          SIGNEOF
          elif [ -f "android/app/build.gradle" ]; then
            cat >> android/app/build.gradle << 'SIGNEOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("madhura-release-key.jks")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "madhura"
                      keyPassword "${{ secrets.KEYSTORE_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          SIGNEOF
          else
            echo "::error::Couldn't find android/app/build.gradle.kts or android/app/build.gradle for signing config."
            exit 1
          fi

      # The Firebase config file identifies which cloud project the app
      # talks to. It's not committed to the repo (so it isn't publicly
      # visible) — instead it's stored as a repo secret and written out
      # here at build time. See the README for how to add this secret.
      - name: Write Firebase config from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # Wires the Google Services Gradle plugin so the config file above
      # actually gets picked up. Flutter's Android template has used both
      # Kotlin DSL (settings.gradle.kts / build.gradle.kts) and the older
      # Groovy DSL (build.gradle) across versions, so this handles both.
      - name: Apply Google Services Gradle plugin
        run: |
          if [ -f "android/settings.gradle.kts" ]; then
            echo "Kotlin DSL project detected"
            sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            sed -i '/dev.flutter.flutter-gradle-plugin/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f "android/build.gradle" ]; then
            echo "Groovy DSL project detected"
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          else
            echo "::error::Couldn't find android/settings.gradle.kts or android/build.gradle — Android project structure may have changed."
            exit 1
          fi

      # Wires the Crashlytics Gradle plugin the same way as Google
      # Services above, for crash reporting (firebase_crashlytics).
      # Uses v3.0.0, not the older 2.x line — 2.x was tried first as the
      # more conservative choice, but failed a real build with a missing
      # groovy/util/XmlSlurper class, a known symptom of an old plugin
      # built against an older Gradle's bundled Groovy running under a
      # much newer one. v3.0.0 is Firebase's own current stable release,
      # specifically built to resolve compatibility issues with AGP
      # 8.1+ — the version already in use here. It doesn't touch the
      # Crashlytics extension block (mappingFile, defaultConfig), so the
      # breaking changes v3 introduces for those don't apply, since this
      # setup never configured them.
      - name: Apply Crashlytics Gradle plugin
        run: |
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i '/^plugins {/a\    id("com.google.firebase.crashlytics") version "3.0.0" apply false' android/settings.gradle.kts
            sed -i '/dev.flutter.flutter-gradle-plugin/a\    id("com.google.firebase.crashlytics")' android/app/build.gradle.kts
          elif [ -f "android/build.gradle" ]; then
            sed -i "/dependencies {/a\\        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.0'" android/build.gradle
            echo "apply plugin: 'com.google.firebase.crashlytics'" >> android/app/build.gradle
          fi

      # Firebase's own component-discovery mechanism looks up a specific
      # registered class at runtime to confirm each Firebase product
      # (Crashlytics included) is actually present — R8, Android's code
      # shrinker, can strip or rename that class since nothing in this
      # app's own code calls it directly, causing the exact runtime
      # error seen here: "FirebaseCrashlytics component is not
      # present." These are Firebase's own documented keep rules for
      # this, applied defensively regardless of whether R8 is confirmed
      # to be the cause — harmless if it isn't, since a keep rule simply
      # does nothing when nothing would have stripped that class anyway.
      - name: Add Crashlytics ProGuard/R8 keep rules
        run: |
          cat >> android/app/proguard-rules.pro << 'PROGUARDEOF'

          # Firebase component discovery — keeps Crashlytics (and other
          # Firebase products) discoverable by Firebase's own runtime
          # lookup, which R8 can otherwise break by stripping or
          # renaming the registrar classes it depends on.
          -keep class com.google.firebase.components.ComponentRegistrar { *; }
          -keep class * implements com.google.firebase.components.ComponentRegistrar
          -keep class com.google.firebase.crashlytics.** { *; }
          -keep interface com.google.firebase.crashlytics.** { *; }
          -keepattributes SourceFile,LineNumberTable
          -keep public class * extends java.lang.Exception
          PROGUARDEOF
          if [ -f "android/app/build.gradle.kts" ]; then
            cat >> android/app/build.gradle.kts << 'PGCONFIGEOF'

          android {
              buildTypes {
                  release {
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }
          PGCONFIGEOF
          elif [ -f "android/app/build.gradle" ]; then
            cat >> android/app/build.gradle << 'PGCONFIGEOF'

          android {
              buildTypes {
                  release {
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          PGCONFIGEOF
          fi

      - name: Install dependencies
        run: flutter pub get

      # Some plugins (file_picker's dependency chain, in this project)
      # need a newer Android compileSdk than Flutter's template sets by
      # default. Rather than finding and replacing a specific line (which
      # depends on guessing the exact format Flutter generated), this
      # simply appends an override at the end of the file — Gradle applies
      # the last assignment to a property, so this works regardless of
      # what's already in the file.
      # The error is specifically from the *file_picker plugin's own*
      # Gradle module (":file_picker:checkReleaseAarMetadata"), not our
      # app module — so patching android/app/build.gradle.kts (our app
      # only) never touched it, which is why compileSdk kept showing as
      # 34 no matter what. The fix has to apply to every module (app +
      # every plugin, including file_picker) at once, via a root-level
      # "subprojects" block — this is the standard fix for this exact
      # class of Flutter/Gradle plugin-compileSdk-mismatch error.
      - name: Force compileSdk 36 across app and all plugin modules
        run: |
          cat >> android/build.gradle.kts << 'GRADLEEOF'

          subprojects {
              val applyCompileSdk: () -> Unit = {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let {
                      it.compileSdkVersion(36)
                  }
              }
              if (state.executed) {
                  applyCompileSdk()
              } else {
                  afterEvaluate { applyCompileSdk() }
              }
          }
          GRADLEEOF
          echo "--- Resulting android/build.gradle.kts ---"
          cat android/build.gradle.kts

          # Keep the app-level override too, as a belt-and-suspenders backup.
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "" >> android/app/build.gradle.kts
            echo "android.compileSdk = 36" >> android/app/build.gradle.kts
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhura-agro-traders-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
