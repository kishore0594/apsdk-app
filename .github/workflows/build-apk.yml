name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android project files if missing
        run: |
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Android project missing — regenerating..."
            rm -rf android
            flutter create --platforms=android --project-name madhura_agro_traders --org com.yourstore .
          fi

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Madhura Agro Traders"/' android/app/src/main/AndroidManifest.xml

      - name: Write Firebase config from secret
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret is empty or missing!"
          else
            echo "$FIREBASE_CONFIG" > android/app/google-services.json
          fi

      - name: Apply Google Services Gradle plugin
        run: |
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            sed -i '/dev.flutter.flutter-gradle-plugin/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f "android/build.gradle" ]; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure compileSdk 36 safely
        run: |
          echo "android.compileSdk=36" >> android/gradle.properties

          # Safely patch Groovy build.gradle if present
          if [ -f "android/build.gradle" ]; then
            cat << 'GEOF' >> android/build.gradle

subprojects {
    project.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.support') {
                details.useVersion '28.0.0'
            }
        }
    }
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android {
                compileSdkVersion 36
            }
        }
    }
}
GEOF
          fi

          # Safely patch Kotlin build.gradle.kts if present
          if [ -f "android/build.gradle.kts" ]; then
            cat << 'KEOF' >> android/build.gradle.kts

subprojects {
    afterEvaluate {
        val androidObj = extensions.findByName("android")
        if (androidObj is com.android.build.gradle.BaseExtension) {
            androidObj.compileSdkVersion(36)
        }
    }
}
KEOF
          fi

          # Patch app level build file
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/g' android/app/build.gradle
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhura-agro-traders-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
